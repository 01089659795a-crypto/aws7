<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>회원가입</title>
</head>
<body>
	<!-- 
	회원 갑을을 위한 화면을 구성하세요.
	입력 정보 : 아이디, 비번, 비번확인, 이메일, 성별
	-->
	<h1>회원가입</h1>
	<form action="" method="get">
		<div>
			<label for="id">아이디</label>
			<div>
				<input type="text" name="id" id="id" placeholder="아이디를 입력하세요" required>
			</div>
			<label for="pw">비번</label>
			<div>
				<input type="password" name="pw" id="pw" placeholder="비밀번호를 입력하세요" required>
			</div>
			<div>
				<input type="password" name="pw2" id="pw2" placeholder="비밀번호 확인을 입력하세요">
			</div>
			<div>
			<label for="email">이메일</label>
				<input type="email" name="email" id="email" placeholder="이메일을 입력하세요">
			</div>
			<label>
				<input type="radio" name="gender" value="male" checked> 남성
			</label>
			<label>
				<input type="radio" name="gender" value="female"> 여성
			</label>
		</div>
		<button>회원가입</button>
	</form>
</body>
</html>
