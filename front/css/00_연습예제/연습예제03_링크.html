<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>연습예제</title>
	<style>
		a{ text-decoration: none; color: black;}
		a:hover{ text-decoration: underline black;}
		a:visited{ color: red;}

		.naver{ text-decoration: none; color: black;}
		.naver:hover{ text-decoration: underline black;}
		.naver:visited{ color: red;}
		

	</style>
</head>
<body>
	<!-- 
	다음 a태그의 글자색을 검정색으로 바꾸고 밑줄을 지우세요.
	태그를 hover하면 글자에 밑줄이 생기게 바꾸세요.
	해당 링크를 방문하면 글자가 빨간색이 되도록 바꾸세요.
	-->
	<div>
		<a href="//naver.com" >네이버로 이동</a>
	</div>
	<div>
		<a href="//naver.com" class="naver">네이버로 이동</a>
	</div>
</body>
</html>
