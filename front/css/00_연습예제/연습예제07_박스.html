<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>박스 예제</title>
	<style>
		.container{ width: 300px; height: 120px; border: 3px solid black; margin-bottom: 10px;}
		.box{ width: 280px; height: 100px; background: red;}
		.container>.box{
			margin: 10px;
		}
		.container1{width: 300px; border: 3px solid black;}
		.wrap{padding: 10px;}
		.container1>.box{ width: 100%; height: 100px; background-color: red;}
	</style>
</head>
<body>
	<div class="container">
		<div class="box"></div>
	</div>
	<div class="container1">
		<div class="wrap">
			<div class="box"></div>
		</div>
	</div>
</body>
</html>
