<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>기본 선택자</title>
	<!-- 
	선택자
	- 요소(태그)를 선택하는 방법
	>> 어떤 HTML 요소에 스타일을 적용할 것인지 지정하는 대상
	>> 속성은 "무엇을 변경할 것인지"를 나타내는 것

	선택자{
		속성 : 값;
		속성 : 값;
	}
	선택자{속성:값; 속성:값}

	1. 전체 선택자(p.72)
	- *
	- 모든 태그를 선택할 때 사용
	- 우선 순위 : 0

	2. 태그 선택자(p.74)
	- 태그 이름만 쓰면 됨
	- 해당 태그들을 모두 선택
	- 우선 순위 : 1
	>> 태그(Tag)는 HTML에서 웹페이지의 구조와 내용을 만드는 명령어
		즉, "이것은 제목이다.", "이것은 문단이다.", "이것은 이미지다."를 브라우저에게 알려주는 표시

	3. 클래스 선택자(p.86)
	- .클래스
	- 태그의 class 속성의 값이 일치하는 요소를 선택
	- class 속성은 기능은 없음. 스타일을 적용할 때 사용
	- 우선 순위 : 10

	4. 아이디 선택자(p.87)
	- #아이디
	- id 속성의 값이 일치하는 요소를 선택
	- 우선 순위 : 100

	선택자{
		속성 : 값 !important;	
	}
		- !important : 우선순위를 무시하고 무조건 적용, 자주 사용하지 말자
	-->
	<style>
		*{ color: red;}
		div{ font-size: 30px; color: blue;}
		.bg-yellow{ background: yellow; color: green;}
		#hi{ font-weight: bold; color: aqua;}
	</style>
</head>
<body>

		<div>안녕</div>
		<div class="bg-yellow box">안녕</div>
		<p>안녕</p>
		<span>안녕</span>
		<div id="hi">안녕</div>
		<a href="#" class="bg-yellow">안녕</a>
	
</body>
</html>
